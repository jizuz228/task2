<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список сотрудников</title>
    <!-- Подключаем Bootstrap 5 через CDN для красивых стилей -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 text-dark">Список сотрудников</h1>
        <a th:href="@{/employees/add}" class="btn btn-primary">Добавить сотрудника</a>
    </div>

    <!-- Сообщение об ошибке, если не удалось удалить или найти -->
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <!-- Форма поиска и фильтрации -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form th:action="@{/employees}" method="get" class="row g-3 align-items-end">
                <!-- Поиск по ФИО -->
                <div class="col-md-5">
                    <label for="name" class="form-label">Поиск по ФИО</label>
                    <input type="text" id="name" name="name" th:value="${currentName}"
                           class="form-control" placeholder="Введите имя или фамилию...">
                </div>

                <!-- Фильтр по активности -->
                <div class="col-md-4">
                    <label for="active" class="form-label">Статус активности</label>
                    <select id="active" name="active" class="form-select">
                        <option value="" th:selected="${currentActive == null}">Все статусы</option>
                        <option value="true" th:selected="${currentActive == true}">Активные</option>
                        <option value="false" th:selected="${currentActive == false}">Неактивные</option>
                    </select>
                </div>

                <!-- Кнопки управления -->
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-success w-100">Применить</button>
                    <a th:href="@{/employees}" class="btn btn-secondary w-100">Сбросить</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Таблица со списком сотрудников -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0 align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col" class="ps-3">ID</th>
                        <th scope="col">ФИО</th>
                        <th scope="col">Email</th>
                        <th scope="col">Телефон</th>
                        <th scope="col">Должность</th>
                        <th scope="col">Зарплата</th>
                        <th scope="col">Статус</th>
                        <th scope="col" class="text-end pe-3">Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Если список сотрудников пуст -->
                    <tr th:if="${#lists.isEmpty(employees)}">
                        <td colspan="8" class="text-center text-muted py-4">Сотрудники не найдены</td>
                    </tr>

                    <!-- Перебор списка сотрудников -->
                    <tr th:each="employee : ${employees}">
                        <td class="ps-3" th:text="${employee.id}">1</td>
                        <td class="fw-bold" th:text="${employee.fullName}">Иванов Иван</td>
                        <td th:text="${employee.email}">ivan@example.com</td>
                        <td th:text="${employee.phone}">+79991234567</td>
                        <td th:text="${employee.position}">Разработчик</td>
                        <td th:text="${#numbers.formatCurrency(employee.salary)}">50 000 ₽</td>
                        <td>
                            <span th:if="${employee.active}" class="badge bg-success">Активен</span>
                            <span th:unless="${employee.active}" class="badge bg-danger">Неактивен</span>
                        </td>
                        <td class="text-end pe-3">
                            <div class="d-inline-flex gap-2">
                                <!-- Ссылка "Изменить" -->
                                <a th:href="@{/employees/edit/{id}(id=${employee.id})}"
                                   class="btn btn-sm btn-outline-warning">Изменить</a>

                                <!-- Форма для безопасного удаления по POST-запросу -->
                                <form th:action="@{/employees/delete/{id}(id=${employee.id})}"
                                      method="post"
                                      onsubmit="return confirm('Вы уверены, что хотите удалить этого сотрудника?');"
                                      class="m-0">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
